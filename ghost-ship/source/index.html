<!doctype html><html><head><style>
html,body{margin:0;background:#000;overflow:hidden}
#t{position:fixed;left:0;right:0;bottom:7%;text-align:center;font:700 54px/1 'Courier New',monospace;letter-spacing:10px;color:#bff8ff;text-shadow:0 0 18px #3ff,4px 4px 0 #012;opacity:0}
#s{position:fixed;left:0;right:0;bottom:3%;text-align:center;font:700 20px 'Courier New',monospace;letter-spacing:6px;color:#8cc;opacity:0}
#f{position:fixed;inset:0;background:#000;opacity:1}
</style></head><body><div id="t">GHOST SHIP</div><div id="s">THE SEA REMEMBERS</div><div id="f"></div>
<script type="module">
import * as THREE from './node_modules/three/build/three.module.js';
const W=1280,H=720;
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(W,H);r.setPixelRatio(1);document.body.appendChild(r.domElement);
const sc=new THREE.Scene();const FOG=0x0b1c2c;sc.background=new THREE.Color(0x0a1a2c);sc.fog=new THREE.FogExp2(0x142f48,0.011);
const cam=new THREE.PerspectiveCamera(52,W/H,0.1,400);
sc.add(new THREE.HemisphereLight(0x8fb4e8,0x1a2a3a,2.3));
const moon=new THREE.DirectionalLight(0xcfe4ff,2.6);moon.position.set(-30,50,-40);sc.add(moon);
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const box=new THREE.BoxGeometry(1,1,1);
function inst(list,mat){const m=new THREE.InstancedMesh(box,mat,list.length);const d=new THREE.Object3D();const c=new THREE.Color();
 list.forEach((b,i)=>{d.position.set(b[0],b[1],b[2]);d.updateMatrix();m.setMatrixAt(i,d.matrix);c.set(b[3]);const v=0.88+rnd()*0.24;c.multiplyScalar(v);m.setColorAt(i,c)});return m}
// ship
const hull=[],sail=[],glow=[],trim=[];
const wood=[0x7a5636,0x8a6440,0x674628];const pick=a=>a[(rnd()*a.length)|0];
for(let x=-14;x<=14;x++){
 const t=Math.abs(x)/14;let hw=Math.round(4*(1-Math.pow(t,2.6)))+ (Math.abs(x)<10?1:0); if(hw<0)hw=0;
 for(let y=0;y<=3;y++){const w=y==0?Math.max(0,hw-2):y==1?Math.max(0,hw-1):hw;
  for(let z=-w;z<=w;z++){const edge=Math.abs(z)==w||Math.abs(x)>=13;if(y==0||edge||y==0)hull.push([x,y,z,pick(wood)]);else if(y==1)hull.push([x,y,z,0x4a3320])}}
 // deck
 const dw=Math.max(0,hw-1);for(let z=-dw;z<=dw;z++)hull.push([x,3,z,0x9a7448]);
 // rail
 if(Math.abs(x)<13)for(const z of [-hw,hw])hull.push([x,4,z,pick(wood)]);
}
// bow rise + bowsprit
for(let i=0;i<6;i++){hull.push([15+i,4+Math.floor(i*0.6),0,0x7a5636]);hull.push([14,3+i%3,0,0x7a5636])}
for(let i=0;i<3;i++)for(let z=-1;z<=1;z++)hull.push([14+i,4,z,0x8a6440]);
// stern castle
for(let x=-14;x<=-8;x++)for(let z=-4;z<=4;z++){if(Math.abs(z)>4-(x==-14?1:0))continue;hull.push([x,4,z,0x8a6440]);if(x==-14||x==-8||Math.abs(z)==4)for(let y=5;y<=6;y++)hull.push([x,y,z,pick(wood)])}
for(let x=-14;x<=-8;x++)for(let z=-4;z<=4;z++)hull.push([x,7,z,0x7a5636]);
for(const z of [-3,-1,1,3])hull.push([-14,5,z,0x7fffe8]); // stern windows
for(let z=-3;z<=3;z+=2){glow.push([-14.6,5,z,0x66fff0])}
// masts
const masts=[[-9,26,-3],[0,32,0],[9,24,0]];
masts.forEach(([x,h,s])=>{for(let y=4;y<h;y++)hull.push([x,y,0,0x5a3d24]);hull.push([x,h,0,0x5a3d24]);glow.push([x,h+1,0,0x66fff0]);
 // yards & sails (tattered)
 const levels=h>28?[[8,18,9],[19,29,7]]:[[7,15,7],[16,23,6]];
 if(h>28)levels.push([30,32,0]);
 levels.forEach(([y0,y1,half],li)=>{ if(half==0)return;
  for(let z=-half-1;z<=half+1;z++)hull.push([x,y1+1,z,0x5a3d24]);
  for(let z=-half;z<=half;z++)for(let y=y0;y<=y1;y++){const n=Math.sin(z*1.7+y*0.9+x)*0.5+rnd()*0.9;
   const taper=(y-y0)/(y1-y0+1);const rip=y<y0+3&&n>0.55||n>1.05;if(rip)continue;
   if(Math.abs(z)>half-taper*1.5&&rnd()<0.5)continue;
   sail.push([x+0.0,y,z,pick([0xbfd3d6,0xa9c2c8,0x93acb4])])}})
});
// sail meshes need to be 2 blocks thick? keep 1, front offset by .5
const hullM=inst(hull,new THREE.MeshLambertMaterial({emissive:0x0f3a40,emissiveIntensity:1}));
const sailM=inst(sail.map(b=>[b[0]+0.5,b[1],b[2],b[3]]),new THREE.MeshLambertMaterial({transparent:true,opacity:0.78,emissive:0x1a4a55,emissiveIntensity:1.6}));
const glowM=inst(glow,new THREE.MeshBasicMaterial({}));
const ship=new THREE.Group();ship.add(hullM,sailM,glowM);sc.add(ship);
// ghost aura: slightly bigger translucent additive hull
const aura=hullM.clone();aura.material=new THREE.MeshBasicMaterial({color:0x2ff0e0,transparent:true,opacity:0.07,blending:THREE.AdditiveBlending,depthWrite:false});aura.scale.setScalar(1.06);ship.add(aura);
// lanterns
const lights=[];[[-14,6,0],[0,34,0],[16,6,0],[9,26,0],[-9,28,0],[0,6,0]].forEach(p=>{const l=new THREE.PointLight(0x40ffe8,p[1]>20?60:90,34,1.6);l.position.set(...p);ship.add(l);lights.push(l)});
// ocean
const N=84;const oc=[];for(let x=0;x<N;x++)for(let z=0;z<N;z++)oc.push([x-N/2,0,z-N/2,0x15485e]);
const ocM=inst(oc,new THREE.MeshLambertMaterial({}));sc.add(ocM);
const od=new THREE.Object3D(),oc2=new THREE.Color();
function ocean(t){let i=0;for(let x=0;x<N;x++)for(let z=0;z<N;z++){const px=x-N/2,pz=z-N/2;
 const h=(Math.sin(px*0.35+t*1.3)*0.6+Math.sin(pz*0.28-t*1.0+px*0.1)*0.6+Math.sin((px+pz)*0.2+t*0.7)*0.5)*0.75;
 const y=Math.round(h)-1.2;od.position.set(px+0.5,y,pz+0.5);od.updateMatrix();ocM.setMatrixAt(i,od.matrix);
 const k=0.68+(y+2.2)*0.3;oc2.setRGB(0.06*k+0.03,0.24*k+0.06,0.32*k+0.1);if(y>0.3)oc2.lerp(new THREE.Color(0x9fdde4),0.35);ocM.setColorAt(i,oc2);i++}
 ocM.instanceMatrix.needsUpdate=true;ocM.instanceColor.needsUpdate=true}
// stars
const sg=new THREE.BufferGeometry();const sp=[];for(let i=0;i<500;i++){const a=rnd()*Math.PI*2,e=0.12+rnd()*0.9;const R=170;sp.push(Math.cos(a)*Math.cos(e)*R,Math.sin(e)*R,Math.sin(a)*Math.cos(e)*R)}
sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));sc.add(new THREE.Points(sg,new THREE.PointsMaterial({size:2,color:0xcfe8ff,fog:false,sizeAttenuation:false})));
// moon block
const mo=new THREE.Mesh(new THREE.BoxGeometry(18,18,2),new THREE.MeshBasicMaterial({color:0xf2f7ff,fog:false}));cam.add(mo);mo.position.set(-48,38,-170);sc.add(cam);
const mh=new THREE.Mesh(new THREE.BoxGeometry(34,34,1),new THREE.MeshBasicMaterial({color:0x6a9cff,transparent:true,opacity:0.18,fog:false,depthWrite:false}));cam.add(mh);mh.position.set(-48,38,-171);
// soul wisps
const wp=[];for(let i=0;i<140;i++)wp.push({x:(rnd()-.5)*50,y:rnd()*30,z:(rnd()-.5)*30,s:0.5+rnd()*1.5,p:rnd()*9});
const wm=new THREE.InstancedMesh(new THREE.BoxGeometry(0.35,0.35,0.35),new THREE.MeshBasicMaterial({color:0x7fffee,transparent:true,opacity:0.85}),wp.length);sc.add(wm);
// fog banks
const fb=[];for(let i=0;i<26;i++)fb.push({x:(rnd()-.5)*90,z:(rnd()-.5)*70-10,y:-0.5+rnd()*2,sx:10+rnd()*14,sz:5+rnd()*8,p:rnd()*6});
const fm=new THREE.InstancedMesh(box,new THREE.MeshBasicMaterial({color:0x9fc8d8,transparent:true,opacity:0.10,depthWrite:false}),fb.length);sc.add(fm);
const D=new THREE.Object3D();
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
window.renderAt=(t)=>{
 const u=t/15;
 ocean(t);
 // ship motion
 ship.position.y=Math.sin(t*1.1)*0.5+0.6;ship.rotation.z=Math.sin(t*0.9)*0.035;ship.rotation.x=Math.sin(t*0.7+1)*0.03;
 // camera: low sweeping orbit then pull-up
 const a=-2.35+ease(u)*2.9;const rad=58+ease(u)*8;const hgt=3.5+ease(u)*12+Math.sin(t*0.8)*0.4;
 cam.position.set(Math.cos(a)*rad*0.9+ 0,hgt,Math.sin(a)*rad);cam.lookAt(0,13+ease(u)*3,0);
 cam.fov=54-ease(u)*4;cam.updateProjectionMatrix();
 lights.forEach((l,i)=>l.intensity=(i>2?55:85)*(0.8+0.25*Math.sin(t*(3+i)+i*2)+ (Math.sin(t*23+i*5)>0.93?-0.4:0)));
 wp.forEach((w,i)=>{const y=((w.y+t*w.s*1.2)%32);D.position.set(w.x+Math.sin(t*0.8+w.p)*1.5,y,w.z+Math.cos(t*0.7+w.p)*1.5);D.scale.setScalar(0.6+0.4*Math.sin(t*3+w.p));D.updateMatrix();wm.setMatrixAt(i,D.matrix)});wm.instanceMatrix.needsUpdate=true;
 fb.forEach((f,i)=>{D.position.set(((f.x+t*1.4+60)%120)-60,f.y,f.z);D.scale.set(f.sx,1.2,f.sz);D.updateMatrix();fm.setMatrixAt(i,D.matrix)});fm.instanceMatrix.needsUpdate=true;
 r.render(sc,cam);
 const fade=Math.min(1,t/1.2)*Math.min(1,(15-t)/1.0);document.getElementById('f').style.opacity=1-fade;
 document.getElementById('t').style.opacity=Math.max(0,Math.min(1,(t-9)/1.0))*Math.min(1,(14.3-t)/0.7);
 document.getElementById('s').style.opacity=Math.max(0,Math.min(1,(t-10.2)/1.0))*Math.min(1,(14.3-t)/0.7);
};
window.ready=true;
</script></body></html>
